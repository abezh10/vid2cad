# Shared training config for all VLMs in the comparison.
# All 4 models use identical hyperparameters for a fair baseline.

# Data
manifest_dir: /scratch/users/abzhong/stage2b
frames_dir: /scratch/users/abzhong/stage2b/frames
n_frames: 8
max_seq_len: 4096

# Output
output_root: /scratch/users/abzhong/stage3_runs

# Training
epochs: 3
per_device_batch_size: 1
gradient_accumulation_steps: 8        # effective batch 8
learning_rate: 1.0e-4
warmup_steps: 100
lr_scheduler: cosine
weight_decay: 0.01
max_grad_norm: 1.0
precision: bf16
gradient_checkpointing: true

# LoRA
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

# Logging / Checkpointing
logging_steps: 10
eval_steps: 500
save_steps: 500
save_total_limit: 3

# Generation (for eval / inference)
gen_max_new_tokens: 3072
gen_temperature: 0.0
gen_do_sample: false

# Sim2real train-time augmentation (Workstream B2). OFF by default so existing
# runs are unchanged. Set enabled: true to roughen synthetic frames toward real
# phone-video statistics (exposure/WB/gamma, blur, downscale, noise, JPEG, crop).
# Applied to the TRAIN RGB frames only — never val/eval, never depth. Per-op
# probabilities/magnitudes default in stage3/augment.py:DEFAULT_AUGMENT; override
# individual ops here, e.g. noise: {p: 0.5, sigma_max: 8}.
augment:
  enabled: false

# Models. Each entry overrides only what's necessary.
models:
  kimi:
    hf_id: moonshotai/Kimi-VL-A3B-Thinking-2506
    # Kimi's LM is DeepSeek-V3 (MLA attention + MoE). q_lora_rank is None so q
    # is a plain q_proj, but K/V go through kv_a_proj_with_mqa + kv_b_proj — there
    # is no k_proj/v_proj. The shared experts (always active) are differentiable
    # even with the routed-expert MoE pinned to eval, so we adapt them too; the
    # 64 routed experts stay frozen (dotted name excludes them, avoids OOM).
    lora_target_modules: ["q_proj", "kv_a_proj_with_mqa", "kv_b_proj", "o_proj", "shared_experts.gate_proj", "shared_experts.up_proj", "shared_experts.down_proj"]
    n_frames: 4
  qwen:
    hf_id: Qwen/Qwen3-VL-8B-Instruct
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  # ViT-adaptation ablation (CS231n): IDENTICAL to `qwen` but LoRA also adapts the
  # 27-block Qwen3-VL vision transformer — attention (qkv, proj) + MLP (linear_fc1,
  # linear_fc2; the same suffixes also cover the vision->LLM merger). qkv / proj /
  # linear_fc* are vision-only leaves and do NOT collide with the LLM's *_proj
  # names (PEFT suffix-matches on `.proj`, not `.q_proj`). Train via
  #   train_qwen.py --model_key qwen_vit  -> stage3_runs/qwen_vit
  # and compare IoU/exec against the frozen-ViT baseline stage3_runs/qwen.
  qwen_vit:
    hf_id: Qwen/Qwen3-VL-8B-Instruct
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj", "qkv", "proj", "linear_fc1", "linear_fc2"]
  glm:
    hf_id: zai-org/GLM-4.1V-9B-Thinking
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  internvl:
    hf_id: OpenGVLab/InternVL3-8B-hf
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
